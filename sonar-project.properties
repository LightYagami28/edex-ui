sonar.projectKey=LightYagami28_edex-ui
sonar.organization=lightyagami28

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=edex-ui
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# src/assets/vendor and src/assets/misc/file-icons-match.js + file-icons.json
# are machine-generated by file-icons-generator.js from an upstream source
# (see that script's header comment) - not hand-maintained, same reason
# they're already excluded from Prettier in .prettierignore.
sonar.exclusions=src/assets/vendor/**,src/assets/misc/file-icons-match.js,src/assets/icons/file-icons.json,node_modules/**,src/node_modules/**,dist/**,prebuild-src/**
