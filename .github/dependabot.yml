version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 20
  groups:
    minori-e-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: nuget
  directories:
  - C:/Program Files/Git/src/Core
  - /tests/Core.Tests
  schedule:
    interval: daily
  open-pull-requests-limit: 20
  groups:
    minori-e-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: dotnet-sdk
  directory: C:/Program Files/Git/
  schedule:
    interval: daily
  open-pull-requests-limit: 20
  groups:
    minori-e-patch:
      update-types:
      - minor
      - patch
