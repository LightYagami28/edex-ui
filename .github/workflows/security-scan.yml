name: Advanced Security Scanning

on:
  schedule:
    # Run every 6 hours for comprehensive 24/7 coverage
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  NODE_VERSION: 26.7.0

jobs:
  snyk-scan:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup npm
        # Pinned to an exact version (not the "latest" floating tag) and run
        # with --ignore-scripts: these jobs only read the dependency tree
        # for scanning, they never build or run the app, so there's no need
        # to execute any package's install/postinstall lifecycle scripts.
        run: npm i --ignore-scripts -g npm@12.0.2

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run Snyk to check for vulnerabilities (Root)
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

      - name: Install src dependencies
        run: cd src && npm ci --ignore-scripts

      - name: Run Snyk to check for vulnerabilities (Src)
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=src/package.json

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            --format=json
            --output-file=osv-results.json
            --allow-no-lockfiles
            ./

      - name: Upload OSV results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: osv-scan-results
          path: osv-results.json
          retention-days: 30

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup npm
        # Pinned to an exact version (not the "latest" floating tag) and run
        # with --ignore-scripts: these jobs only read the dependency tree
        # for scanning, they never build or run the app, so there's no need
        # to execute any package's install/postinstall lifecycle scripts.
        run: npm i --ignore-scripts -g npm@12.0.2

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          cd src && npm ci --ignore-scripts

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: 'edex-ui'
          path: '.'
          format: 'ALL'
          # NOTE: this action's own input at this pinned version is called
          # "others", not "args" (that's the name on the action's default
          # branch, which has since diverged from this release) - verified
          # against action.yml at the exact pinned SHA.
          others: >
            --enableRetired
            --enableExperimental
            --scan ./package-lock.json
            --scan ./src/package-lock.json
            --nodePackageSkipDevDependencies false

      - name: Upload Dependency-Check results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ALLOWED_LICENSES: "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;GPL-3.0;GPL-3.0-or-later;Unlicense;WTFPL"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup npm
        # Pinned to an exact version (not the "latest" floating tag) and run
        # with --ignore-scripts: these jobs only read the dependency tree
        # for scanning, they never build or run the app, so there's no need
        # to execute any package's install/postinstall lifecycle scripts.
        run: npm i --ignore-scripts -g npm@12.0.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check licenses
        run: |
          npx license-checker --summary --production --onlyAllow "${{ env.ALLOWED_LICENSES }}" || true

      - name: Check src licenses
        run: |
          cd src
          npm ci --ignore-scripts
          npx license-checker --summary --production --onlyAllow "${{ env.ALLOWED_LICENSES }}" || true

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [snyk-scan, trivy-scan, osv-scanner, dependency-check]
    if: always()
    steps:
      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Snyk Scan: ${{ needs.snyk-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy Scan: ${{ needs.trivy-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- OSV Scanner: ${{ needs.osv-scanner.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- OWASP Dependency Check: ${{ needs.dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scan completed at: $(date -u)" >> $GITHUB_STEP_SUMMARY
