name: CI

on:
  push:
    branches: [master, native/base, native/windows, native/linux, native/macos]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and test with coverage
        shell: bash
        run: dotnet test --configuration Release --coverage --coverage-output-format cobertura --coverage-output cov.cobertura.xml --results-directory TestResults
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**/cov.cobertura.xml

  sonar:
    name: SonarCloud
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: coverage
      - name: Merge coverage from all systems
        run: python3 tools/coverage-to-sonar.py sonar-coverage.xml $(find coverage -name cov.cobertura.xml)
      - name: Analyze
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 12.0.0
          dotnet sonarscanner begin /k:"LightYagami28_edex-ui" /o:"lightyagami28" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.coverageReportPaths="sonar-coverage.xml"
          dotnet build --configuration Release
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
